# Builds the APK on GitHub's servers. Actions tab > "Build APK" > Run workflow,
# then download "discord-quiet-hours-apk" from the finished run.
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 21
      - uses: android-actions/setup-android@v3

      - run: npm ci
      - run: npm test
      - run: rm -rf android && npx cap add android && node scripts/setup-android.mjs
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: discord-quiet-hours-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
